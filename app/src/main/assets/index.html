<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12060a">
<title>Arena Sombría</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--b:clamp(58px,17vmin,96px)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,Roboto,sans-serif}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#controls{position:fixed;inset:0;pointer-events:none;display:none}
.cl,.cr{position:absolute;bottom:max(12px,env(safe-area-inset-bottom))}
.cl{left:max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.cr{right:max(16px,env(safe-area-inset-right));display:grid;grid-template-columns:repeat(2,auto);gap:10px}
.btn,#dpad{pointer-events:auto;touch-action:none}
.btn{width:var(--b);height:var(--b);border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.32);color:#fff;font:700 clamp(9px,2.5vmin,14px)/1.1 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;letter-spacing:.4px;text-shadow:0 1px 3px #000}
.btn i{font-style:normal;font-size:1.9em;line-height:1}
.btn.on{background:rgba(255,130,60,.55);border-color:#ffb27a;transform:scale(.94)}
#sp.rdy{border-color:#ffd24a;box-shadow:0 0 14px 3px rgba(255,190,60,.7)}
#dpad{display:flex;width:calc(var(--b)*2.3);height:var(--b);border-radius:999px;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.32)}
#dpad span{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:calc(var(--b)*.42);border-radius:999px;pointer-events:none}
#dpad span.on{background:rgba(255,130,60,.55)}
#rot{position:fixed;inset:0;background:#0b0305;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font:600 20px/1.5 system-ui;z-index:9;padding:30px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
  <div class="cl">
    <div class="btn" id="bj"><i>⬆</i>SALTO</div>
    <div id="dpad"><span id="dl">◀</span><span id="dr">▶</span></div>
  </div>
  <div class="cr">
    <div class="btn" id="bp"><i>👊</i>PUÑO</div>
    <div class="btn" id="bk"><i>👟</i>PATADA</div>
    <div class="btn" id="bb"><i>🛡</i>BLOQUEO</div>
    <div class="btn" id="sp"><i>🔥</i>ESPECIAL</div>
  </div>
</div>
<div id="rot">🔄<br>Gira el teléfono<br>para jugar en horizontal</div>

<script>
'use strict';
/* =====================  ARENA SOMBRÍA · mini beta  =====================
   Juego de peleas 2D original. 1 vs CPU, mejor de 3 rondas.
   Teclado: ←→ mover · ↑/W saltar · J puño · K patada · L/↓ bloqueo · U/Espacio especial
======================================================================== */
const W=800,H=450,GROUND=372;
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0,dpr=1;
function resize(){
  dpr=window.devicePixelRatio||1;
  cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr);
  scale=Math.min(cv.width/W,cv.height/H);
  ox=(cv.width-W*scale)/2; oy=(cv.height-H*scale)/2;
}
addEventListener('resize',resize); resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function darken(h,k){const n=parseInt(h.slice(1),16);return `rgb(${(n>>16)*k|0},${(n>>8&255)*k|0},${(n&255)*k|0})`}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

/* ---------------- datos ---------------- */
const ROSTER=[
  {name:'KAEL',sub:'Maestro del fuego',col:'#ff5a2a',col2:'#ffc15a',spd:3.2,dmg:1.0,jump:-13,vel:3,pod:3},
  {name:'VESPER',sub:'Filo de hielo',col:'#33c4ff',col2:'#d6f6ff',spd:3.9,dmg:0.85,jump:-14,vel:5,pod:2},
  {name:'BRAKK',sub:'Puño de roca',col:'#7ed348',col2:'#e0c46c',spd:2.7,dmg:1.25,jump:-12,vel:2,pod:5}
];
const BOSS={name:'SOMBRA',sub:'Jefe final',col:'#a64bff',col2:'#ff4bd8',spd:3.6,dmg:1.15,jump:-13.5};
const ATK={
  punch:{start:3,act:4,rec:9,dmg:6,rng:62,hy:-86,kb:4,stun:14,gain:6},
  kick:{start:6,act:5,rec:13,dmg:10,rng:80,hy:-56,kb:8,stun:20,gain:9},
  special:{start:9,act:1,rec:22}
};
const CARD_X=[160,400,640];

/* ---------------- estado ---------------- */
const G={phase:'title',lvl:0,sel:0,round:1,timer:3600,pt:0,bt:0,p:null,c:null,winner:null,timeout:false,
  mwin:false,shake:0,hitstop:0,paused:false,projs:[],parts:[],rings:[],best:0};
try{G.best=+localStorage.getItem('as_best')||0}catch(e){}
const held={left:0,right:0,block:0}, keys={left:0,right:0,block:0};
const press={jump:0,punch:0,kick:0,special:0};

function setPhase(p){
  G.phase=p; G.pt=0; G.hitstop=0;
  $('controls').style.display=(p==='intro'||p==='fight'||p==='ko')?'block':'none';
}
function mk(def,x,face,cpu){
  return {def,x,y:GROUND,vx:0,vy:0,face,hp:100,hpLag:100,en:0,st:'idle',t:0,anim:0,atk:'',hit:false,stun:0,
    cpu,wins:0,win:false,ai:{t:30,mode:'wait'},consumed:false};
}
function startMatch(i){G.sel=i;G.lvl=0;startFight()}
function startFight(){
  const others=ROSTER.filter((_,i)=>i!==G.sel), list=[others[0],others[1],BOSS];
  G.p=mk(ROSTER[G.sel],200,1,false);
  G.c=mk(list[G.lvl%3],600,-1,true);
  G.round=1; startRound();
}
function startRound(){
  [[G.p,200,1],[G.c,600,-1]].forEach(([f,x,face])=>{
    Object.assign(f,{x,y:GROUND,vx:0,vy:0,face,hp:100,hpLag:100,en:0,st:'idle',t:0,atk:'',hit:false,stun:0,win:false,consumed:false});
    f.ai={t:30,mode:'wait'};
  });
  G.timer=3600; G.projs=[]; G.parts=[]; G.rings=[]; G.shake=0;
  setPhase('intro');
}
function endRound(){
  const p=G.p,c=G.c; let w=null;
  if(p.hp<=0&&c.hp<=0) w=null;
  else if(c.hp<=0) w='p'; else if(p.hp<=0) w='c';
  else if(p.hp>c.hp) w='p'; else if(c.hp>p.hp) w='c';
  G.winner=w; G.timeout=(p.hp>0&&c.hp>0);
  if(w==='p'){p.wins++;p.win=true}
  if(w==='c'){c.wins++;c.win=true}
  G.projs=[]; setPhase('ko');
  if(G.timeout) sfx('bell');
}
function afterKO(){
  if(G.p.wins>=2||G.c.wins>=2){
    G.mwin=G.p.wins>=2; setPhase('matchend');
    if(G.mwin){
      sfx('bell');
      if(G.lvl+1>G.best){G.best=G.lvl+1;try{localStorage.setItem('as_best',G.best)}catch(e){}}
    }
  } else { G.round++; startRound(); }
}

/* ---------------- audio ---------------- */
let AC=null;
function audioInit(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,vol){
  if(!AC)return; const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
}
function noise(dur,vol,hp){
  if(!AC)return; const n=(AC.sampleRate*dur)|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=AC.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
function sfx(k){
  try{
    if(k==='swing')noise(0.08,0.10,2500);
    else if(k==='hit'){tone(170,50,0.15,'square',0.22);noise(0.1,0.22,800)}
    else if(k==='block')tone(520,300,0.06,'square',0.13);
    else if(k==='special')tone(300,900,0.25,'sawtooth',0.13);
    else if(k==='ko'){tone(220,40,0.7,'sawtooth',0.26);noise(0.4,0.26,300)}
    else if(k==='bell')tone(660,660,0.5,'sine',0.18);
    else if(k==='fight')tone(220,440,0.2,'square',0.16);
  }catch(e){}
}

/* ---------------- lógica de combate ---------------- */
function startAtk(f,k){f.st='atk';f.atk=k;f.t=0;f.hit=false;f.consumed=true;sfx(k==='special'?'special':'swing')}

function update(f,o,inp){
  const d=f.def; f.t++; f.anim++;
  const air=f.y<GROUND;
  if(f.st==='ko'){ f.vx*=0.9; }
  else if(f.st==='hurt'){ f.vx*=0.85; if(f.t>=f.stun){f.st='idle';f.t=0} }
  else if(f.st==='atk'){
    const A=ATK[f.atk];
    if(f.atk==='special'&&f.t===A.start){
      G.projs.push({x:f.x+f.face*40,y:f.y-74,vx:f.face*7.5,owner:f,dmg:14*d.dmg,life:130});
    }
    if(f.t>=A.start+A.act+A.rec){f.st='idle';f.t=0}
    if(!air)f.vx*=0.6;
  } else {
    if(!air)f.face=o.x>=f.x?1:-1;
    if(inp.block&&!air){ f.st='block'; f.vx=0; }
    else {
      if(f.st==='block')f.st='idle';
      const mv=(inp.right?1:0)-(inp.left?1:0);
      if(!air){
        f.vx=mv*d.spd; f.st=mv?'walk':'idle';
        if(inp.jump){f.vy=d.jump;f.vx=mv*d.spd*1.15;f.consumed=true}
      }
      if(inp.special&&f.en>=50&&!air){f.en-=50;startAtk(f,'special')}
      else if(inp.kick)startAtk(f,'kick');
      else if(inp.punch)startAtk(f,'punch');
    }
  }
  f.vy+=0.78; f.x+=f.vx; f.y+=f.vy;
  if(f.y>=GROUND){f.y=GROUND;f.vy=0}
  f.x=clamp(f.x,34,W-34);
}
function separate(a,b){
  const dx=b.x-a.x,ad=Math.abs(dx);
  if(ad<46&&Math.abs(a.y-b.y)<60&&a.st!=='ko'&&b.st!=='ko'){
    const push=(46-ad)/2,dir=dx>=0?1:-1;
    a.x=clamp(a.x-dir*push,34,W-34); b.x=clamp(b.x+dir*push,34,W-34);
  }
}
function hitFx(x,y,col,big){
  for(let i=0;i<(big?14:8);i++){
    const a=rnd(0,6.283),s=rnd(2,big?8:5);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(14,26),max:26,col,size:rnd(1.5,3.5)});
  }
  G.rings.push({x,y,r:6,life:10,col});
}
function applyHit(att,vic,dmg,kb,stun,gain,x,y){
  const dir=vic.x>=att.x?1:-1;
  if(vic.st==='block'){
    vic.hp=Math.max(1,vic.hp-dmg*0.12);
    vic.vx=dir*kb*0.7; vic.en=Math.min(100,vic.en+3); att.en=Math.min(100,att.en+2);
    hitFx(x,y,'#9fd8ff',false); sfx('block'); G.shake=Math.max(G.shake,2); G.hitstop=2;
  } else {
    vic.hp=Math.max(0,vic.hp-dmg);
    vic.st='hurt'; vic.t=0; vic.stun=stun; vic.vx=dir*kb; if(vic.y<GROUND)vic.vy=-5;
    att.en=Math.min(100,att.en+gain); vic.en=Math.min(100,vic.en+gain*0.6);
    hitFx(x,y,'#ffd9a0',dmg>=9); sfx('hit'); G.shake=Math.max(G.shake,dmg*0.7); G.hitstop=dmg>=9?5:3;
    if(!vic.cpu&&navigator.vibrate){try{navigator.vibrate(20)}catch(e){}}
  }
  if(vic.hp<=0){vic.st='ko';vic.t=0;vic.vy=-9;vic.vx=dir*5;G.hitstop=10;G.shake=10;sfx('ko')}
}
function tryHit(f,o){
  if(f.st!=='atk'||f.hit||f.atk==='special'||o.st==='ko')return;
  const A=ATK[f.atk];
  if(f.t<A.start||f.t>=A.start+A.act)return;
  const x2=f.x+f.face*A.rng, lo=Math.min(f.x,x2)-10, hi=Math.max(f.x,x2)+10;
  if(o.x+20<lo||o.x-20>hi)return;
  const hy=f.y+A.hy;
  if(hy+24<o.y-118||hy-24>o.y)return;
  f.hit=true;
  applyHit(f,o,A.dmg*f.def.dmg,A.kb,A.stun,A.gain,f.x+f.face*(A.rng-8),hy);
}
function stepProjs(){
  for(const p of G.projs){p.x+=p.vx;p.life--}
  for(let i=0;i<G.projs.length;i++)for(let j=i+1;j<G.projs.length;j++){
    const a=G.projs[i],b=G.projs[j];
    if(a.owner!==b.owner&&Math.abs(a.x-b.x)<26&&Math.abs(a.y-b.y)<26){a.life=b.life=0;hitFx((a.x+b.x)/2,a.y,'#ffffff',true);sfx('block')}
  }
  for(const p of G.projs){
    if(p.life<=0)continue;
    const o=p.owner===G.p?G.c:G.p;
    if(o.st!=='ko'&&Math.abs(p.x-o.x)<30&&p.y>o.y-122&&p.y<o.y+6){applyHit(p.owner,o,p.dmg,7,22,8,p.x,p.y);p.life=0}
    if(p.x<-40||p.x>W+40)p.life=0;
  }
  G.projs=G.projs.filter(p=>p.life>0);
}

/* ---------------- IA del rival ---------------- */
function aiInput(f,o){
  const a=f.ai,lvl=Math.min(G.lvl,8),inp={};
  if(f.st==='hurt'||f.st==='ko'||f.st==='atk')return inp;
  const dx=o.x-f.x,dist=Math.abs(dx),tw=dx>=0?1:-1;
  const toward=()=>{if(tw>0)inp.right=1;else inp.left=1};
  const away=()=>{if(tw>0)inp.left=1;else inp.right=1};
  a.t--;
  if(a.t<=0){
    const r=Math.random(),ag=Math.min(0.85,0.4+lvl*0.07);
    a.t=Math.max(4,Math.floor(14-lvl*1.2+Math.random()*10));
    const threat=o.st==='atk'&&dist<125;
    if(threat&&r<0.28+lvl*0.07)a.mode='block';
    else if(dist>260)a.mode=(f.en>=50&&r<0.5)?'fire':(r<0.1?'jump':'approach');
    else if(dist>115)a.mode=r<ag?'approach':(r<ag+0.12?'kick':(r<0.92?'wait':'jump'));
    else a.mode=r<ag?(r<ag*0.55?'punch':'kick'):(r<ag+0.18?'block':'retreat');
  }
  if((a.mode==='punch'&&dist>80)||(a.mode==='kick'&&dist>98)){toward();return inp}
  switch(a.mode){
    case 'approach':toward();break;
    case 'retreat':if(f.x<70||f.x>W-70)a.mode='kick';else away();break;
    case 'block':inp.block=1;break;
    case 'jump':inp.jump=1;toward();a.mode='wait';break;
    case 'punch':inp.punch=1;a.mode='wait';a.t=Math.max(a.t,8);break;
    case 'kick':inp.kick=1;a.mode='wait';a.t=Math.max(a.t,10);break;
    case 'fire':inp.special=1;a.mode='wait';a.t=Math.max(a.t,14);break;
  }
  return inp;
}
function playerInput(){
  return {left:held.left||keys.left,right:held.right||keys.right,block:held.block||keys.block,
    jump:press.jump>0,punch:press.punch>0,kick:press.kick>0,special:press.special>0};
}

/* ---------------- bucle lógico ---------------- */
const EMB=[];for(let i=0;i<38;i++)EMB.push({x:rnd(0,W),y:rnd(0,H),v:rnd(0.2,0.8),s:rnd(0.8,2.2),ph:rnd(0,6)});
function updateFx(){
  for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const r of G.rings){r.r+=3;r.life--}
  G.rings=G.rings.filter(r=>r.life>0);
  for(const e of EMB){e.y-=e.v;e.x+=Math.sin(G.bt*0.02+e.ph)*0.3;if(e.y<-5){e.y=H+5;e.x=rnd(0,W)}}
}
function tick(){
  G.bt++;
  const ph=G.phase;
  if(ph==='title'||ph==='select'||ph==='matchend'){G.pt++;updateFx();return}
  if(G.hitstop>0){G.hitstop--;return}
  G.pt++;
  const p=G.p,c=G.c; let ip={},ic={};
  if(ph==='intro'){
    if(G.pt===1)sfx('bell'); if(G.pt===55)sfx('fight');
  }
  if(ph==='fight'){ip=playerInput();ic=aiInput(c,p);G.timer--}
  update(p,c,ip); update(c,p,ic);
  if(p.consumed){press.jump=press.punch=press.kick=press.special=0}
  p.consumed=false; c.consumed=false;
  separate(p,c);
  if(ph==='fight'){
    tryHit(p,c); tryHit(c,p); stepProjs();
    p.en=Math.min(100,p.en+0.04); c.en=Math.min(100,c.en+0.04);
    if(p.hp<=0||c.hp<=0||G.timer<=0)endRound();
  }
  for(const f of [p,c]) f.hpLag=f.hpLag>f.hp?Math.max(f.hp,f.hpLag-0.35):f.hp;
  for(const k in press)if(press[k]>0)press[k]--;
  G.shake*=0.85;
  updateFx();
  if(G.phase==='intro'&&G.pt>=100)setPhase('fight');
  else if(G.phase==='ko'&&G.pt>=170)afterKO();
}

/* ---------------- dibujo ---------------- */
const BG=document.createElement('canvas');BG.width=1600;BG.height=900;
(function(){
  const c=BG.getContext('2d');c.scale(2,2);
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0509');g.addColorStop(.55,'#4a0f14');g.addColorStop(1,'#12070a');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  const mg=c.createRadialGradient(560,120,10,560,120,170);
  mg.addColorStop(0,'rgba(255,230,200,.95)');mg.addColorStop(.25,'rgba(255,170,120,.55)');mg.addColorStop(1,'rgba(255,80,60,0)');
  c.fillStyle=mg;c.fillRect(0,0,W,H);
  c.fillStyle='#ffe9d2';c.beginPath();c.arc(560,120,46,0,7);c.fill();
  function ridge(col,base,amp,seed){
    c.fillStyle=col;c.beginPath();c.moveTo(0,H);
    for(let x=0;x<=W;x+=16)c.lineTo(x,base-amp*(0.5+0.5*Math.sin(x*0.013+seed)+0.3*Math.sin(x*0.041+seed*2)));
    c.lineTo(W,H);c.closePath();c.fill();
  }
  ridge('#35101a',300,90,1);ridge('#220a12',330,70,4);
  c.fillStyle='#14060a';
  c.fillRect(290,170,22,210);c.fillRect(488,170,22,210);
  c.beginPath();c.moveTo(250,176);c.quadraticCurveTo(400,198,550,176);c.lineTo(562,158);c.quadraticCurveTo(400,182,238,158);c.closePath();c.fill();
  c.fillRect(272,208,256,14);
  const fg=c.createLinearGradient(0,GROUND-10,0,H);fg.addColorStop(0,'#3a1519');fg.addColorStop(1,'#0c0507');
  c.fillStyle=fg;c.fillRect(0,GROUND-10,W,H);
  c.strokeStyle='rgba(255,120,80,.30)';c.lineWidth=2;c.beginPath();c.moveTo(0,GROUND-10);c.lineTo(W,GROUND-10);c.stroke();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1.5;
  for(let x=-400;x<=1200;x+=70){c.beginPath();c.moveTo(400+(x-400)*0.35,GROUND-10);c.lineTo(x,H);c.stroke()}
  const mist=c.createLinearGradient(0,GROUND-60,0,GROUND+10);mist.addColorStop(0,'rgba(255,90,60,0)');mist.addColorStop(1,'rgba(255,90,60,.10)');
  c.fillStyle=mist;c.fillRect(0,GROUND-60,W,70);
})();

function txt(s,x,y,size,col,align,stroke){
  ctx.font=`900 ${size}px Impact,"Arial Black",system-ui,sans-serif`;
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke!==false){ctx.lineWidth=Math.max(3,size/7);ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
function limb(x,y,a1,l1,a2,l2,w,col){
  const kx=x+Math.sin(a1)*l1,ky=y+Math.cos(a1)*l1,fx=kx+Math.sin(a2)*l2,fy=ky+Math.cos(a2)*l2;
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(kx,ky);ctx.lineTo(fx,fy);ctx.stroke();
  return [fx,fy];
}
function pose(f){
  const t=f.anim,air=f.y<GROUND-0.5;
  let lean=0,bob=Math.sin(t*0.08)*1.5,crouch=0;
  let FL=[0.4,0.15],BL=[-0.45,-0.2],FA=[0.75,2.5],BA=[0.4,2.7];
  if(air){FL=[1.1,0.2];BL=[0.3,-0.6];FA=[0.9,2.2];BA=[0.2,2.5];bob=0}
  else if(f.st==='walk'){
    const s=Math.sin(t*0.3);
    FL=[0.4+s*0.6,0.2+Math.max(0,-s)*0.6];BL=[-0.45-s*0.6,-0.2+Math.max(0,s)*0.6];bob=-Math.abs(s)*2;
  }
  if(f.win&&f.st==='idle'){FA=[2.5,3.0];BA=[2.3,3.05];bob=-Math.abs(Math.sin(t*0.15))*6}
  if(f.st==='block'){FA=[0.5,2.95];BA=[0.3,3.0];crouch=6;lean=0.1}
  if(f.st==='hurt'){lean=-0.35;FA=[-0.6,-0.2];BA=[-0.9,-0.4]}
  if(f.st==='ko'){FA=[-0.4,0.2];BA=[-0.6,0.3];FL=[0.2,0.1];BL=[-0.2,0.1]}
  if(f.st==='atk'){
    const A=ATK[f.atk];
    const e=f.t<A.start?-0.25*(f.t/A.start):f.t<A.start+A.act?1:Math.max(0,1-(f.t-A.start-A.act)/A.rec);
    f.e=e;
    if(f.atk==='punch'){FA=[0.75+e*0.82,2.5-e*0.93];lean=e*0.12}
    else if(f.atk==='kick'){FL=[0.4+e*1.15,0.15+e*1.4];lean=-e*0.22;FA=[0.2,2.6]}
    else {FA=[0.9+e*0.67,2.4-e*0.83];BA=[0.7+e*0.87,2.5-e*0.93];lean=e*0.1;crouch=3}
  } else f.e=0;
  return {lean,bob,crouch,FL,BL,FA,BA};
}
function drawFighter(f){
  const d=f.def,P=pose(f),t=f.anim,h=GROUND-f.y;
  ctx.save();ctx.globalAlpha=0.35*clamp(1-h/260,0.2,1);ctx.fillStyle='#000';
  ctx.beginPath();ctx.ellipse(f.x,GROUND+3,34*clamp(1-h/400,0.5,1),7,0,0,6.3);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.face,1);
  if(f.st==='ko'){const k=clamp(f.t/16,0,1);ctx.translate(0,-10*k);ctx.rotate(-k*1.45)}
  const hipY=-56+P.crouch+P.bob;
  const sh=[Math.sin(P.lean)*38,hipY-Math.cos(P.lean)*38];
  const skin='#e9c7a0',dark=darken(d.col,0.55),pants='#17141c',pantsF='#0d0b11';
  if(f.en>=50&&f.st!=='ko'){
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(0,-60,10,0,-60,70);g.addColorStop(0,hexA(d.col,0.28));g.addColorStop(1,hexA(d.col,0));
    ctx.fillStyle=g;ctx.fillRect(-80,-140,160,160);ctx.globalCompositeOperation='source-over';
  }
  let ft=limb(0,hipY,P.BL[0],28,P.BL[1],28,11,pantsF);
  ctx.fillStyle='#08060a';ctx.beginPath();ctx.ellipse(ft[0]+4,ft[1]+1,8,4,0,0,6.3);ctx.fill();
  let hd=limb(sh[0],sh[1],P.BA[0],20,P.BA[1],20,9,dark);
  ctx.fillStyle=darken('#e9c7a0',0.7);ctx.beginPath();ctx.arc(hd[0],hd[1],5,0,6.3);ctx.fill();
  ctx.strokeStyle=d.col;ctx.lineWidth=22;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,hipY-2);ctx.lineTo(sh[0],sh[1]+2);ctx.stroke();
  ctx.strokeStyle=d.col2;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-10,hipY-3);ctx.lineTo(10,hipY-3);ctx.stroke();
  ft=limb(0,hipY,P.FL[0],28,P.FL[1],28,11,pants);
  ctx.fillStyle='#0b090e';ctx.beginPath();ctx.ellipse(ft[0]+4,ft[1]+1,8,4,0,0,6.3);ctx.fill();
  const hx=sh[0]+Math.sin(P.lean)*12+2,hy=sh[1]-Math.cos(P.lean)*13;
  ctx.fillStyle='#1b1520';ctx.beginPath();ctx.arc(hx,hy,12.5,0,6.3);ctx.fill();
  ctx.fillStyle=skin;ctx.fillRect(hx+1,hy-5,12,6);
  ctx.fillStyle='#000';ctx.fillRect(hx+8,hy-3,3,3);
  ctx.strokeStyle=d.col2;ctx.lineWidth=4;ctx.lineCap='butt';
  ctx.beginPath();ctx.moveTo(hx-12,hy-8);ctx.lineTo(hx+12,hy-8);ctx.stroke();
  const w1=Math.sin(t*0.2)*4;
  ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(hx-11,hy-8);ctx.quadraticCurveTo(hx-22,hy-6+w1,hx-32,hy-1+w1*1.5);
  ctx.moveTo(hx-11,hy-8);ctx.quadraticCurveTo(hx-20,hy-12-w1,hx-29,hy-14-w1);ctx.stroke();
  hd=limb(sh[0],sh[1],P.FA[0],20,P.FA[1],20,9,d.col);
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(hd[0],hd[1],5.5,0,6.3);ctx.fill();
  if(f.st==='atk'&&f.atk==='special'&&f.e>0.3){
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(hd[0],hd[1],2,hd[0],hd[1],30);
    g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.4,hexA(d.col,0.6));g.addColorStop(1,hexA(d.col,0));
    ctx.fillStyle=g;ctx.fillRect(hd[0]-30,hd[1]-30,60,60);
  }
  ctx.restore();
}
function drawProjs(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of G.projs){
    const col=p.owner.def.col;
    for(let i=4;i>=0;i--){
      const x=p.x-p.vx*i*1.6,r=(22-i*3)*(1+0.1*Math.sin(G.bt*0.6));
      const g=ctx.createRadialGradient(x,p.y,1,x,p.y,r);
      g.addColorStop(0,i?hexA(col,0.5):'rgba(255,255,255,.95)');g.addColorStop(.4,hexA(col,i?0.35:0.8));g.addColorStop(1,hexA(col,0));
      ctx.fillStyle=g;ctx.fillRect(x-r,p.y-r,r*2,r*2);
    }
  }
  ctx.restore();
}
function drawFx(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of G.parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.3);ctx.fill()}
  for(const r of G.rings){ctx.globalAlpha=r.life/10;ctx.strokeStyle=r.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.3);ctx.stroke()}
  ctx.restore();
}
function drawEmbers(){
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,140,70,.65)';
  for(const e of EMB){ctx.globalAlpha=0.35+0.4*Math.sin(G.bt*0.05+e.ph);ctx.beginPath();ctx.arc(e.x,e.y,e.s,0,6.3);ctx.fill()}
  ctx.restore();
}
function bar(x,y,w,h,v,lag,c0,c1,flip){
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x-3,y-3,w+6,h+6);
  const fw=w*clamp(v/100,0,1),lw=w*clamp(lag/100,0,1);
  ctx.fillStyle='#fff';if(flip)ctx.fillRect(x+w-lw,y,lw,h);else ctx.fillRect(x,y,lw,h);
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;
  if(flip)ctx.fillRect(x+w-fw,y,fw,h);else ctx.fillRect(x,y,fw,h);
}
function drawHUD(){
  const p=G.p,c=G.c;
  const lo=f=>f.hp<25;
  bar(24,24,316,18,p.hp,p.hpLag,lo(p)?'#ff5a5a':'#ffe14a',lo(p)?'#a00':'#ff7a1a',true);
  bar(460,24,316,18,c.hp,c.hpLag,lo(c)?'#ff5a5a':'#ffe14a',lo(c)?'#a00':'#ff7a1a',false);
  const rd=f=>f.en>=50;
  bar(24,52,190,6,p.en,p.en,rd(p)?'#ffd24a':'#4ac8ff',rd(p)?'#ff9a1a':'#1a6aff',false);
  bar(586,52,190,6,c.en,c.en,rd(c)?'#ffd24a':'#4ac8ff',rd(c)?'#ff9a1a':'#1a6aff',true);
  txt(p.def.name,24,76,15,p.def.col,'left');
  txt(c.def.name,776,76,15,c.def.col,'right');
  for(let i=0;i<2;i++){
    ctx.fillStyle=i<p.wins?'#ffd24a':'rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(330-i*16,74,5,0,6.3);ctx.fill();
    ctx.fillStyle=i<c.wins?'#ffd24a':'rgba(255,255,255,.2)';ctx.beginPath();ctx.arc(470+i*16,74,5,0,6.3);ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(374,18,52,40);
  txt(String(Math.max(0,Math.ceil(G.timer/60))),400,39,30,G.timer<600?'#ff6a5a':'#fff');
}
function drawFight(){
  const p=G.p,c=G.c;
  if(p.st==='atk'||c.st!=='atk'){drawFighter(c);drawFighter(p)}else{drawFighter(p);drawFighter(c)}
  drawProjs();drawFx();drawHUD();
  const ph=G.phase;
  if(ph==='intro'){
    if(G.pt<55){
      const fin=(p.wins===1&&c.wins===1);
      const k=1+Math.max(0,10-G.pt)*0.05;
      ctx.save();ctx.translate(400,190);ctx.scale(k,k);
      txt(fin?'RONDA FINAL':'RONDA '+G.round,0,0,64,'#ffd9a0');ctx.restore();
      txt('vs '+c.def.name+(c.def===BOSS?'  ·  JEFE':''),400,240,20,'#ffb27a');
    } else {
      const k=1+Math.max(0,65-G.pt)*0.04;
      ctx.save();ctx.translate(400,190);ctx.scale(k,k);txt('¡PELEA!',0,0,86,'#ff5a2a');ctx.restore();
    }
  } else if(ph==='ko'){
    txt(G.timeout?'TIEMPO':'K.O.',400,170,G.timeout?70:100,'#ff3a2a');
    if(G.pt>60){
      const t=G.winner==='p'?'GANAS LA RONDA':G.winner==='c'?'PIERDES LA RONDA':'EMPATE';
      txt(t,400,250,30,'#fff');
    }
  } else if(ph==='matchend'){
    ctx.fillStyle='rgba(0,0,0,.66)';ctx.fillRect(0,0,W,H);
    if(G.mwin){
      txt('¡VICTORIA!',400,150,90,'#ffd24a');
      txt('Racha: '+(G.lvl+1)+(G.best>0?'   ·   Récord: '+G.best:''),400,222,22,'#fff');
      const nx=[...ROSTER.filter((_,i)=>i!==G.sel),BOSS][(G.lvl+1)%3];
      txt('Siguiente rival: '+nx.name,400,262,20,'#ffb27a');
      if(Math.floor(G.bt/30)%2===0)txt('TOCA PARA CONTINUAR',400,330,28,'#fff');
    } else {
      txt('DERROTA',400,150,90,'#ff4a3a');
      txt('Ganaste '+G.lvl+(G.lvl===1?' pelea':' peleas')+(G.best>0?'   ·   Récord: '+G.best:''),400,222,22,'#fff');
      [[190,'REINTENTAR'],[410,'MENÚ']].forEach(([x,l])=>{
        ctx.fillStyle='rgba(255,255,255,.12)';ctx.strokeStyle='#ffb27a';ctx.lineWidth=3;
        ctx.beginPath();ctx.rect(x,295,200,54);ctx.fill();ctx.stroke();txt(l,x+100,322,24,'#fff');
      });
    }
  }
  if(G.paused){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);txt('PAUSA',400,200,70,'#fff');txt('toca para continuar',400,260,22,'#ffb27a')}
}
function fake(def,x,face){return {def,x,y:GROUND,face,st:'idle',t:0,anim:G.bt,atk:'',en:0,win:false,e:0}}
function drawTitle(){
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
  drawFighter(fake(ROSTER[0],170,1));drawFighter(fake(ROSTER[1],630,-1));
  const s=1+Math.sin(G.bt*0.04)*0.02;
  ctx.save();ctx.translate(400,0);ctx.scale(s,s);
  txt('ARENA',0,92,80,'#ff6a3a');txt('SOMBRÍA',0,168,80,'#ffd9a0');ctx.restore();
  txt('MINI BETA · v0.1',400,222,18,'#ffb27a');
  if(Math.floor(G.bt/30)%2===0)txt('TOCA PARA EMPEZAR',400,300,30,'#fff');
  if(G.best>0)txt('Récord: '+G.best+(G.best===1?' victoria seguida':' victorias seguidas'),400,408,16,'#ffd24a');
  txt('Juego original · 1 vs CPU · mejor de 3 rondas',400,432,13,'rgba(255,255,255,.55)',null,false);
}
function pips(x,y,n,col){for(let i=0;i<5;i++){ctx.fillStyle=i<n?col:'rgba(255,255,255,.15)';ctx.fillRect(x+i*17,y-5,13,10)}}
function drawSelect(){
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
  txt('ELIGE TU LUCHADOR',400,42,36,'#ffd9a0');
  ROSTER.forEach((d,i)=>{
    const cx=CARD_X[i];
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.strokeStyle=d.col;ctx.lineWidth=3;
    ctx.beginPath();ctx.rect(cx-105,84,210,318);ctx.fill();ctx.stroke();
    txt(d.name,cx,116,30,d.col);
    txt(d.sub,cx,142,13,'#fff',null,false);
    txt('VEL',cx-92,172,12,'#ddd','left',false);pips(cx-40,172,d.vel,d.col);
    txt('PODER',cx-92,194,12,'#ddd','left',false);pips(cx-40,194,d.pod,d.col);
    drawFighter(fake(d,cx,1));
  });
  txt('Toca un luchador para pelear',400,428,14,'rgba(255,255,255,.6)',null,false);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(G.shake>0.5)ctx.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake);
  ctx.drawImage(BG,-8,-8,W+16,H+16);
  drawEmbers();
  if(G.phase==='title')drawTitle();else if(G.phase==='select')drawSelect();else drawFight();
  ctx.restore();
  const rdy=!!(G.p&&G.p.en>=50&&G.phase==='fight');
  if(rdy!==render.rdy){render.rdy=rdy;$('sp').classList.toggle('rdy',rdy)}
}

/* ---------------- entrada ---------------- */
function resumeIfPaused(){if(G.paused){G.paused=false;return true}return false}
function tap(lx,ly){
  if(G.paused){G.paused=false;return}
  if(G.phase==='title'){setPhase('select');sfx('fight');return}
  if(G.phase==='select'){
    for(let i=0;i<3;i++)if(Math.abs(lx-CARD_X[i])<105&&ly>84&&ly<402){startMatch(i);return}
    return;
  }
  if(G.phase==='matchend'&&G.pt>30){
    if(G.mwin){G.lvl++;startFight()}
    else if(ly>290&&ly<355){
      if(lx>=190&&lx<=390)startFight();
      else if(lx>=410&&lx<=610)setPhase('select');
    }
  }
}
cv.addEventListener('pointerdown',e=>{
  audioInit();e.preventDefault();
  tap((e.clientX*dpr-ox)/scale,(e.clientY*dpr-oy)/scale);
});
function bindPress(id,key){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(resumeIfPaused())return;el.classList.add('on');press[key]=6});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>el.classList.remove('on')));
}
function bindHold(id,key){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(resumeIfPaused())return;el.classList.add('on');held[key]=1;try{el.setPointerCapture(e.pointerId)}catch(_){}});
  const up=()=>{held[key]=0;el.classList.remove('on')};
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,up));
}
bindPress('bj','jump');bindPress('bp','punch');bindPress('bk','kick');bindPress('sp','special');bindHold('bb','block');
(function(){
  const dp=$('dpad'),L=$('dl'),R=$('dr');let act=false;
  function set(e){
    const r=dp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
    held.left=x<0.5?1:0;held.right=x>=0.5?1:0;
    L.classList.toggle('on',!!held.left);R.classList.toggle('on',!!held.right);
  }
  function off(){act=false;held.left=held.right=0;L.classList.remove('on');R.classList.remove('on')}
  dp.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(resumeIfPaused())return;act=true;try{dp.setPointerCapture(e.pointerId)}catch(_){}set(e)});
  dp.addEventListener('pointermove',e=>{if(act)set(e)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>dp.addEventListener(n,off));
})();
const KM={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowDown:'block',s:'block',S:'block',l:'block',L:'block'};
const PM={ArrowUp:'jump',w:'jump',W:'jump',j:'punch',J:'punch',k:'kick',K:'kick',' ':'special',u:'special',U:'special'};
addEventListener('keydown',e=>{
  audioInit();
  if(G.phase==='title'){tap(0,0);return}
  if(G.phase==='select'){const i='123'.indexOf(e.key);if(i>=0)startMatch(i);return}
  if(G.phase==='matchend'&&(e.key==='Enter'||e.key===' ')&&G.pt>30){if(G.mwin){G.lvl++;startFight()}else startFight();return}
  const k=KM[e.key];if(k){keys[k]=1;e.preventDefault()}
  const q=PM[e.key];if(q&&!e.repeat){press[q]=6;e.preventDefault()}
});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)keys[k]=0});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.phase==='fight'||G.phase==='intro'))G.paused=true});
addEventListener('blur',()=>{if(G.phase==='fight'||G.phase==='intro')G.paused=true});

/* ---------------- loop ---------------- */
const STEP=1000/60;let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  acc+=Math.min(100,now-last);last=now;
  let n=0;
  while(acc>=STEP&&n<5){if(!G.paused)tick();acc-=STEP;n++}
  if(n===5)acc=0;
  render();
}
requestAnimationFrame(frame);
</script>
